# =============================================================================
# gvkusno.ru — статический сайт Next.js (output: export, trailingSlash: true)
#
# На WebHOST1 / ISPmanager сайт обычно отдаёт nginx, а НЕ Apache.
# Файл .htaccess nginx НЕ читает — без этого конфига будет «404 Not Found nginx».
#
# Куда вставить:
#   ISPmanager → Сайты → gvkusno.ru → Настройки → Конфигурация nginx
#   или «Дополнительные директивы nginx» / include пользовательского файла.
#
# Замените root на реальный путь к корню сайта (где лежит index.html).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name gvkusno.ru www.gvkusno.ru;

    # Путь к распакованному out/ (уточните в «Менеджер файлов»)
    root /var/www/user/data/www/gvkusno.ru;
    index index.html;

    # www → без www (при необходимости раскомментируйте на HTTPS-блоке)
    if ($host = www.gvkusno.ru) {
        return 301 https://gvkusno.ru$request_uri;
    }

    # Кастомная 404 «не туда» — файл out/404.html обязателен в корне!
    # =404 сохраняет HTTP-код 404 (не 200), а в теле — наша страница
    error_page 404 =404 /404.html;

    # Короткие ссылки
    location = /petergof  { return 301 /zakaz/shashlyk-petergof/; }
    location = /petergof/ { return 301 /zakaz/shashlyk-petergof/; }
    location = /lomonosov { return 301 /zakaz/shashlyk-lomonosov/; }
    location = /lomonosov/ { return 301 /zakaz/shashlyk-lomonosov/; }
    location = /strelna   { return 301 /zakaz/shashlyk-strelna/; }
    location = /strelna/  { return 301 /zakaz/shashlyk-strelna/; }

    # Явная отдача страницы 404 (можно открыть и напрямую для проверки)
    location = /404.html {
        root /var/www/user/data/www/gvkusno.ru;
    }

    # Next.js RSC — клиентская навигация
    location ~ ^(.*/)(__next\.[^/]+)/([^/]+)/__PAGE__\.txt$ {
        try_files $1$2.$3.__PAGE__.txt =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|mp4|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# После выпуска SSL добавьте аналогичный server { listen 443 ssl http2; ... }
# с ssl_certificate / ssl_certificate_key из панели Let's Encrypt.
