# Минимальный фрагмент для «Дополнительные директивы nginx» в ISPmanager.
# Скопируйте ВЕСЬ блок в настройки сайта gvkusno.ru.
# Полный пример сервера: nginx-gvkusno.conf

# Кастомная 404 (файл 404.html в корне сайта обязателен!)
error_page 404 =404 /404.html;

location = /petergof  { return 301 /zakaz/shashlyk-petergof/; }
location = /petergof/ { return 301 /zakaz/shashlyk-petergof/; }
location = /lomonosov { return 301 /zakaz/shashlyk-lomonosov/; }
location = /lomonosov/ { return 301 /zakaz/shashlyk-lomonosov/; }
location = /strelna   { return 301 /zakaz/shashlyk-strelna/; }
location = /strelna/  { return 301 /zakaz/shashlyk-strelna/; }

location ~ ^(.*/)(__next\.[^/]+)/([^/]+)/__PAGE__\.txt$ {
    try_files $1$2.$3.__PAGE__.txt =404;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}
