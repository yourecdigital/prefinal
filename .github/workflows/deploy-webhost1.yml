name: Deploy to WebHOST1 (FTP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-regru.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for production
        run: npm run build:prod
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ secrets.YANDEX_VERIFICATION }}
          NEXT_PUBLIC_YM_ID: ${{ secrets.NEXT_PUBLIC_YM_ID }}

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.WEBHOST1_FTP_HOST }}
          username: ${{ secrets.WEBHOST1_FTP_USER }}
          password: ${{ secrets.WEBHOST1_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.WEBHOST1_FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
